<style>
:root{
--surface-1:#f4f3ef;--surface-2:#ffffff;
--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.26);--border-stronger:rgba(0,0,0,.42);
--text-primary:#1d1c1a;--text-secondary:#66655f;--text-muted:#9b9a93;
--text-danger:#b3261e;--text-success:#17693a;--text-warning:#8a5600;--text-accent:#1a4db3;
--bg-accent:#e5edfb;--border-accent:#3a6ed8;--fill-accent:#2358cc;--on-accent:#ffffff;--bg-accent-muted:rgba(35,88,204,.18);
--bg-success:#e1f3e7;--border-success:#7bc196;--bg-warning:#fcefd3;
--bg-tint-violet:#ece6fa;--text-tint-violet:#573cae;
--bg-tint-orange:#fde9d9;--text-tint-orange:#9c4c0d;
--bg-tint-green:#dff2e3;--text-tint-green:#1d6832;
--bg-tint-aqua:#dcf1f2;--text-tint-aqua:#14646a;
--bg-tint-magenta:#fae4ef;--text-tint-magenta:#a02059;
--bg-tint-yellow:#faf0cf;--text-tint-yellow:#785802;
--bg-tint-blue:#e0ebfa;--text-tint-blue:#1d52a4;
--radius:10px}
@media (prefers-color-scheme:dark){:root{
--surface-1:#1f1e1c;--surface-2:#2a2927;
--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.26);--border-stronger:rgba(255,255,255,.42);
--text-primary:#f1f0ec;--text-secondary:#b0aea6;--text-muted:#7d7b74;
--text-danger:#ff8f86;--text-success:#7fd9a1;--text-warning:#f2bf5c;--text-accent:#8db4ff;
--bg-accent:#1f2f52;--border-accent:#5b8ae6;--fill-accent:#4a7de8;--on-accent:#0f1b33;--bg-accent-muted:rgba(74,125,232,.28);
--bg-success:#1d3a29;--border-success:#3f8a5d;--bg-warning:#40320f;
--bg-tint-violet:#2f2750;--text-tint-violet:#c3b3ff;
--bg-tint-orange:#4a2e16;--text-tint-orange:#ffbd88;
--bg-tint-green:#1e3b27;--text-tint-green:#93e0a7;
--bg-tint-aqua:#17393b;--text-tint-aqua:#8fdde2;
--bg-tint-magenta:#4a1f36;--text-tint-magenta:#ffa9cf;
--bg-tint-yellow:#43380f;--text-tint-yellow:#f2d56a;
--bg-tint-blue:#1d3250;--text-tint-blue:#9bc2ff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;direction:rtl;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--surface-1);color:var(--text-primary);font-size:14px;line-height:1.7}
.scr{max-width:430px;margin:0 auto;min-height:100vh;background:var(--surface-2);overflow:clip}
.scr.wide{max-width:1100px}
@media (min-width:431px){body{padding:16px 0}.scr{min-height:0;border:.5px solid var(--border);border-radius:16px}}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-primary)}
button{background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;cursor:pointer;min-height:40px}
button:active{transform:scale(.98)}
input[type=text],select,textarea{width:100%;border:.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);padding:10px 12px;min-height:44px}
textarea{resize:none;min-height:84px;direction:rtl}
input[type=range]{width:100%}
:focus-visible{outline:2px solid var(--border-accent);outline-offset:2px}
p{margin:0}
h1,h2{font-size:18px;font-weight:500;margin:0}
h3{font-size:16px;font-weight:500;margin:0 0 10px}
i.ti{display:inline-flex;width:1em;height:1em;line-height:1;flex:0 0 auto;align-items:center;justify-content:center}
i.ti svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.heart.on i svg,.rb.on i svg{fill:currentColor}
.sec{padding:16px 14px;border-top:.5px solid var(--border)}
.hint{font-size:13px;color:var(--text-secondary);margin:0 0 12px;line-height:1.8}
.sub{font-size:12px;color:var(--text-secondary)}
.er{font-size:13px;color:var(--text-danger);margin:6px 0 0;display:none}
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px}
/* headers stay visible while scrolling; a thin line appears once the page has scrolled */
.hd,.topbar,.ch-hd,.uhd{position:sticky;top:0;z-index:20;background:var(--surface-2);transition:box-shadow .2s}
.stuck .hd,.stuck .topbar,.stuck .ch-hd,.stuck .uhd{box-shadow:0 .5px 0 var(--border-strong)}
.ib{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.ib i{font-size:18px}
.pb{width:100%;min-height:48px;background:var(--fill-accent);color:var(--on-accent);border:none;font-size:15px;font-weight:500}
.pbx{min-height:48px;padding:0 22px;background:var(--fill-accent);color:var(--on-accent);border:none;font-size:15px;font-weight:500}
.lk{border:none;background:transparent;color:var(--text-accent);min-height:44px;padding:0 4px;font-size:13px}
.fbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:.5px solid var(--border);background:var(--surface-2);position:sticky;bottom:0;z-index:5}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts button{min-height:44px;font-size:13px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.ln.mut{color:var(--text-secondary);font-size:13px}
.ln span:last-child{white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:15px;font-weight:500;padding-top:10px;margin-top:6px;border-top:.5px solid var(--border)}
.badge{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--bg-warning);color:var(--text-warning);white-space:nowrap}
.badge.ok{background:var(--bg-success);color:var(--text-success)}
.badge.n{background:var(--surface-1);color:var(--text-secondary);border:.5px solid var(--border)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg-success);color:var(--text-success)}
.tag.w{background:var(--bg-warning);color:var(--text-warning)}
.circ{width:56px;height:56px;border-radius:50%;background:var(--bg-success);color:var(--text-success);display:inline-flex;align-items:center;justify-content:center}
.circ i{font-size:24px}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex:0 0 40px}
.thumb{border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.thumb i{font-size:24px}
.ctxc{display:flex;gap:12px;align-items:center;border:.5px solid var(--border);border-radius:12px;padding:10px}
.ctxc p+p{margin-top:2px}
.nm{font-size:14px;font-weight:500}
/* no blue tap highlight or accidental selection on clickable things; normal text stays selectable */
*{-webkit-tap-highlight-color:transparent}
button,[data-go],.opt,.chk,.chip,.ni,.card,.rowi,.st,.sw,.nd,.ix,.up,.pill,.tg,.pin,.heart,.rb,.ib,.seg button,.seg2 button,.fchip,i.ti,svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,[data-go],.opt,.chk,.chip,.ni,.nd,.ix,.up,.pill,.tg,.st,.sw{touch-action:manipulation}
[data-go],.opt,.chk,.ni,.ix{cursor:pointer}
input,textarea,select{-webkit-user-select:text;user-select:text}
button:focus:not(:focus-visible),[data-go]:focus:not(:focus-visible),[tabindex]:focus:not(:focus-visible){outline:none}
/* options and checks */
.opt{display:flex;align-items:center;gap:12px;border:.5px solid var(--border-strong);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:52px}
.opt.on{border:2px solid var(--border-accent);padding:11.5px}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-stronger);flex:0 0 20px;display:flex;align-items:center;justify-content:center}
.opt.on .rd{border-color:var(--text-accent)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--text-accent)}
.opt .a{font-size:14px;font-weight:500}
.opt .b{font-size:12px;color:var(--text-secondary)}
.opt i.ic{font-size:18px;color:var(--text-secondary)}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;min-height:44px}
.cb{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1.5px solid var(--border-stronger);display:flex;align-items:center;justify-content:center}
.cb i{font-size:14px;color:var(--on-accent);display:none}
.chk.on .cb{background:var(--fill-accent);border-color:var(--fill-accent)}
.chk.on .cb i{display:block}
.sw{width:44px;height:26px;border-radius:999px;border:none;background:var(--border-stronger);position:relative;padding:0;flex:0 0 44px;min-height:26px}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);transition:right .15s,left .15s}
.sw.on{background:var(--fill-accent)}
.sw.on::after{right:auto;left:3px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:thin}
@media (max-width:768px),(pointer:coarse){.chips{scrollbar-width:none;-ms-overflow-style:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none;width:0;height:0}}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:.5px solid var(--border-strong);background:transparent;font-size:13px;min-height:38px}
.chip.on{background:var(--text-primary);color:var(--surface-2);border-color:var(--text-primary)}
.chip.sel.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
/* cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 14px}
.card{border:.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.card.go{cursor:pointer}
.ph{height:84px;display:flex;align-items:center;justify-content:center;position:relative}
.ph i.ic{font-size:38px}
.heart{position:absolute;top:6px;left:6px;width:32px;height:32px;min-height:32px;border-radius:50%;background:var(--surface-2);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0}
.heart i{font-size:16px;color:var(--text-secondary)}
.heart.on i{color:var(--text-danger)}
.cbd{padding:8px 10px 10px}
.t{font-size:13px;font-weight:500;margin:0 0 2px}
.m{font-size:12px;color:var(--text-secondary);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pr{font-size:13px;font-weight:500;margin-top:6px}
.pr span{font-size:11px;font-weight:400;color:var(--text-secondary)}
.shd{display:flex;justify-content:space-between;align-items:center;padding:18px 14px 10px}
.shd a,.shd span.l{font-size:13px;color:var(--text-accent);cursor:pointer}
/* fields */
.fld{display:flex;align-items:center;gap:8px;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:0 10px;min-height:44px;font-size:14px;color:var(--text-secondary);background:var(--surface-2);flex:1;min-width:0}
.fld i{font-size:18px;color:var(--text-secondary)}
label.l{display:block;font-size:13px;color:var(--text-secondary);margin:12px 0 6px}
.ltr{direction:ltr!important;text-align:left}
/* timeline */
.tl{display:flex;gap:12px;padding:8px 0}
.tl .d{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;justify-content:center;background:var(--bg-success);color:var(--text-success)}
.tl .d.p{background:var(--surface-1);color:var(--text-secondary);border:.5px solid var(--border-strong)}
.tl .d.w{background:var(--bg-warning);color:var(--text-warning);border:none}
.tl .d i{font-size:16px}
.tl .x{font-size:12px;color:var(--text-secondary)}
.box{border:.5px solid var(--border);border-radius:12px;padding:6px 12px}
/* upload */
.add{border:1.5px dashed var(--border-stronger);border-radius:12px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-secondary);font-size:13px;background:transparent;width:100%}
.add i{font-size:24px}
.phs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.phs div{width:56px;height:56px;border-radius:8px;background:var(--bg-tint-violet);display:flex;align-items:center;justify-content:center;color:var(--text-tint-violet)}
.phs div i{font-size:20px}
/* bottom nav */
.nav{display:flex;justify-content:space-around;border-top:.5px solid var(--border);padding:8px 4px max(8px,env(safe-area-inset-bottom));background:var(--surface-2);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30}
body.has-nav .scr{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-secondary);min-width:52px;min-height:44px;justify-content:center;cursor:pointer}
.ni i{font-size:20px}
.ni.on{color:var(--text-accent)}
.ni:active{opacity:.7}
/* ratings */
.stars{display:flex;gap:2px;justify-content:center;margin-top:6px}
.st{width:52px;height:52px;min-height:52px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .15s ease;border-radius:12px}
.st:active{transform:scale(.86)}
.st svg{width:38px;height:38px;overflow:visible}
.st polygon{fill:var(--surface-1);stroke:var(--border-stronger);stroke-width:1.4;stroke-linejoin:round;transition:fill .25s ease,stroke .25s ease}
.st.on polygon{fill:var(--text-warning);stroke:var(--text-warning);stroke-width:1.6}
@keyframes pop{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
.st.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) var(--d,0ms) both}
@keyframes lin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lw{min-height:32px;text-align:center;margin-top:6px}
.rlbl{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--bg-warning);color:var(--text-warning);font-size:13px}
.rlbl:empty{display:none}
.rlbl.in{animation:lin .25s ease both}
.sg{width:14px;height:14px;fill:var(--text-warning);stroke:var(--text-warning);stroke-width:1.6;stroke-linejoin:round;vertical-align:-2px}
.rt{display:inline-flex;align-items:center;gap:3px}
.rt b{font-weight:500;color:var(--text-primary)}
.rt small{font-size:12px;color:var(--text-secondary)}
.fr{position:relative;display:inline-block;direction:rtl;height:20px}
.fr .row{display:flex;gap:2px;height:20px}
.fr .row svg{width:20px;height:20px;flex:0 0 20px}
.fr .bg polygon{fill:var(--surface-1);stroke:var(--border-stronger);stroke-width:1.4;stroke-linejoin:round}
.fr .fg{position:absolute;top:0;right:0;overflow:hidden;white-space:nowrap}
.fr .fg polygon{fill:var(--text-warning);stroke:var(--text-warning);stroke-width:1.6;stroke-linejoin:round}
.dr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);margin-top:6px}
.dr .tr{flex:1;height:6px;border-radius:3px;background:var(--surface-1);overflow:hidden}
.dr .tr i{display:block;height:100%;background:var(--text-warning);border-radius:3px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.dr span:first-child{width:12px;text-align:center}
.dr span:last-child{width:28px;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tg{min-height:36px;border-radius:999px;padding:0 14px;font-size:13px}
.tg.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chip bars on phone-frame pages never show a scrollbar (scrolling still works) */
.chips.hide-sb{scrollbar-width:none;-ms-overflow-style:none}
.chips.hide-sb::-webkit-scrollbar{display:none;width:0;height:0}
/* search field and bottom-sheet pickers (shared by several pages) */
.sfld{display:flex;align-items:center;gap:8px;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:0 12px;min-height:48px;background:var(--surface-2);width:100%;text-align:right;transition:border-color .15s,box-shadow .15s}
.sfld i{font-size:18px;color:var(--text-secondary)}
.sfld:focus-within{border-color:var(--border-accent);box-shadow:0 0 0 3px var(--bg-accent)}
.sfld input{flex:1;min-width:0;border:none;background:transparent;padding:0;min-height:44px;font-size:15px;outline:none;width:auto;box-shadow:none}
.sfld input::placeholder{color:var(--text-muted)}
.sfld span{flex:1;min-width:0;font-size:14px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfld span.set{color:var(--text-primary);font-weight:500}
.sfld.has{border-color:var(--border-accent)}
.sfld .chv{font-size:14px;color:var(--text-muted)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.ov.open{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;max-height:88vh;overflow-y:auto;background:var(--surface-2);border-radius:20px 20px 0 0;z-index:50;display:none;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.sheet.open{display:block;animation:up .25s ease both}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border-stronger);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;padding:6px 14px 8px;gap:8px}
.sheet .sh h2{flex:1;font-size:17px}
.sheet .opt{margin:0 14px 8px}
.sheet .opt i.ck{font-size:18px;color:var(--text-accent);visibility:hidden}
.sheet .opt.on i.ck{visibility:visible}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:var(--text-secondary);padding:0 14px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:6px 14px}
.day{min-height:44px;padding:0;border:none;background:transparent;border-radius:10px;font-size:14px;position:relative}
.day.dis{color:var(--text-muted);opacity:.5}
.day.today::after{content:"";position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text-accent)}
.day.rng{background:var(--bg-accent);color:var(--text-accent);border-radius:0}
.day.sel{background:var(--fill-accent);color:var(--on-accent);font-weight:500}
.day.sel.today::after{background:var(--on-accent)}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:4px 14px}
.mnav button{width:44px;height:44px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.mnav button i{font-size:18px}
.qk{display:flex;gap:8px;padding:0 14px 6px;overflow-x:auto;scrollbar-width:none}
.qk .chip{min-height:36px}
.dfoot{display:flex;align-items:center;gap:12px;padding:8px 14px 0;border-top:.5px solid var(--border);margin-top:6px}

</style>

if(!it.vf)$('ovf').textContent='هویت در حال بررسی';

/* specs */
var SP_=[['دسته‌بندی',it.cn],['وضعیت',['عالی','خیلی خوب','خوب'][it.id%3]],['تحویل',it.tag],['محله',it.nb],['لوازم همراه',ACC[it.g]],['حداقل اجاره','۱ '+(it.u==='ساعت'?'ساعت':it.u)]];
if(it.dep)SP_.push(['ودیعه',it.dep.replace('ودیعه ','')+' تومان']);
SP_.forEach(function(r){var d=document.createElement('div');d.className='sp';var k=document.createElement('p');k.className='k';k.textContent=r[0];var v=document.createElement('p');v.className='v';v.textContent=r[1];d.appendChild(k);d.appendChild(v);$('spec').appendChild(d)});

/* reviews */
(function(){var b=$('revbody');
if(!it.v){b.innerHTML='<p class="hint" style="margin:0">هنوز نظری ثبت نشده است. اولین نفری باش که این وسیله را اجاره می‌کند.</p>';return}
var top=document.createElement('div');top.style.cssText='display:flex;gap:14px;align-items:center;margin-bottom:6px';
var big=document.createElement('div');big.style.cssText='font-size:34px;font-weight:500;line-height:1';big.textContent=nf0.format(it.v);
var side=document.createElement('div');var fr=document.createElement('span');fr.className='fr';var c=document.createElement('p');c.className='sub';c.style.marginTop='4px';c.textContent='از '+nf0.format(it.n)+' نظر';
side.appendChild(fr);side.appendChild(c);top.appendChild(big);top.appendChild(side);b.appendChild(top);fracStars(fr,it.v);
var p5=Math.round(Math.max(40,(it.v-3.5)/1.5*90)),p4=Math.round((100-p5)*0.75),p3=100-p5-p4;
var dist=document.createElement('div');dist.style.marginBottom='14px';b.appendChild(dist);distBars(dist,[[5,p5],[4,p4],[3,p3],[2,0],[1,0]]);
var card=document.createElement('div');card.style.cssText='border:.5px solid var(--border);border-radius:12px;padding:12px';
var h=document.createElement('div');h.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:4px';
var nm=document.createElement('p');nm.style.cssText='font-size:13px;font-weight:500';nm.textContent='کاربر یارا · آبان ۱۴۰۴';
var rr=document.createElement('span');rr.className='rt';rr.innerHTML=glyph()+'<b>'+nf0.format(5)+'</b>';h.appendChild(nm);h.appendChild(rr);
var tx=document.createElement('p');tx.className='hint';tx.style.margin='0';tx.textContent='وسیله مطابق توضیحات بود و هماهنگی تحویل خیلی راحت انجام شد.';
card.appendChild(h);card.appendChild(tx);b.appendChild(card)})();

/* price options for this product */
var P=pricesOf(it),cur=P[0],q=0;
P.forEach(function(x){if(x.k===(it.u==='ساعت'?'h':'d'))cur=x});q=cur.def;
function f(x){return nf.format(Math.round(x))}
$('seg').style.gridTemplateColumns='repeat('+P.length+',minmax(0,1fr))';
P.forEach(function(x){var b=document.createElement('button');b.type='button';b.setAttribute('data-k',x.k);
b.appendChild(document.createTextNode(x.n));var s=document.createElement('small');s.textContent=f(x.p);b.appendChild(s);
b.addEventListener('click',function(){cur=x;q=x.def;$('err').style.display='none';draw()});$('seg').appendChild(b)});
function dateText(){
if(cur.k==='h')return 'فردا · '+nf0.format(q)+' ساعت';
var days=cur.k==='w'?q*7:q;return days>1?lab(start)+' تا '+lab(addDays(start,days-1)):lab(start)}
function draw(){
var base=cur.p*q,fee=base*0.08,tot=base+fee;
document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-k')===cur.k)});
$('ql').textContent='تعداد '+cur.u;$('qv').textContent=f(q);
$('dtl').textContent=dateText();
$('l1').textContent=f(cur.p)+' × '+f(q)+' '+cur.u;
$('s1').textContent=f(base);$('s2').textContent=f(fee);$('dep').textContent=f(depositOf(it));
$('st').textContent=f(tot)+' تومان';$('bt').textContent=f(tot)+' تومان';$('bs').textContent=f(q)+' '+cur.u+' · '+dateText();
$('req').setAttribute('data-go','04-checkout.html?id='+it.id+'&p='+cur.k+'&q='+q)}
$('pl').addEventListener('click',function(){var e=$('err');
if(q>=cur.max){e.textContent='حداکثر مدت اجاره برای این وسیله '+f(cur.max)+' '+cur.u+' است.';e.style.display='block';return}
q++;e.style.display='none';draw()});
$('mn').addEventListener('click',function(){var e=$('err');
if(q<=1){e.textContent='حداقل مدت اجاره یک '+cur.u+' است.';e.style.display='block';return}
q--;e.style.display='none';draw()});
$('hh').addEventListener('click',function(){this.classList.toggle('on')});
draw();
</script>
</body>
</html>
